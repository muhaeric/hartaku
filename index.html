<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Hartaku — Pencatat keuangan pribadi di Google Spreadsheet milikmu</title>
    <meta
      name="description"
      content="Hartaku adalah aplikasi pencatat keuangan pribadi. Catat pemasukan, pengeluaran, transfer antar akun, dan investasi emas — semuanya tersimpan di Google Spreadsheet di dalam Google Drive milikmu sendiri, bukan di server kami."
    />
    <meta property="og:title" content="Hartaku" />
    <meta
      property="og:description"
      content="Catat pemasukan, pengeluaran, transfer antar akun, dan investasi emas. Datamu tersimpan di Google Spreadsheet milikmu sendiri."
    />
    <meta property="og:type" content="website" />

    <!--
      Matches the canvas so the status bar blends with the page. Deliberately one
      tag with no `media`: the theme is a saved setting rather than an OS
      preference, and a media query has no way to express Laut or Bunga at all.
      The script below and SettingsContext keep the value in step.
    -->
    <meta name="theme-color" content="#f6f7fb" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- A raster mark rather than the SVG that used to sit here: the logo is
         artwork, not two strokes, and there is no vector of it to serve. -->
    <link rel="icon" href="/favicon.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hartaku" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Applied before first paint so the theme never flashes.
      try {
        const saved = JSON.parse(localStorage.getItem('hartaku.settings') || '{}')
        const theme = saved.theme || 'auto'
        const root = document.documentElement

        root.dataset.theme =
          theme !== 'auto'
            ? theme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'

        // Only works once the stylesheet has parsed, which is why it is guarded
        // rather than assumed - SettingsContext sets it properly on mount, so
        // the worst case here is the status bar catching up a frame later. No
        // palette is copied into this file.
        const canvas = getComputedStyle(root).getPropertyValue('--canvas').trim()
        if (canvas) {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', 'rgb(' + canvas + ')')
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <!--
      React replaces everything inside #root on mount, so what lands here is only
      ever seen by something that runs no JavaScript - a crawler, or Google's
      OAuth branding review, which reads this page to check the app name and
      purpose.

      The placeholder below is filled at build time from src/lib/landing.js by
      the landingHtmlPlugin in vite.config.js - the same object the React landing
      page renders. Keep it a placeholder: two hand-written copies silently
      disagreeing is what made the review fail in the first place.
    -->
    <div id="root"><!--landing--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

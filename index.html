<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="description" content="Catat pemasukan dan pengeluaran, tersimpan di Google Sheets kamu sendiri." />

    <!-- Matches the canvas in each mode so the status bar blends with the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hartaku" />
    <meta name="mobile-web-app-capable" content="yes" />

    <title>Hartaku</title>
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        const saved = JSON.parse(localStorage.getItem('hartaku.settings') || '{}')
        const theme = saved.theme || 'auto'
        const dark =
          theme === 'dark' ||
          (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

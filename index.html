<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <title>Hartaku — Pencatat keuangan pribadi di Google Spreadsheet milikmu</title>
    <meta
      name="description"
      content="Hartaku adalah aplikasi pencatat keuangan pribadi. Catat pemasukan, pengeluaran, transfer antar akun, dan investasi emas — semuanya tersimpan di Google Spreadsheet di dalam Google Drive milikmu sendiri, bukan di server kami."
    />
    <meta property="og:title" content="Hartaku" />
    <meta
      property="og:description"
      content="Catat pemasukan, pengeluaran, transfer antar akun, dan investasi emas. Datamu tersimpan di Google Spreadsheet milikmu sendiri."
    />
    <meta property="og:type" content="website" />

    <!-- Matches the canvas in each mode so the status bar blends with the page. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f7fb" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1117" />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Hartaku" />
    <meta name="mobile-web-app-capable" content="yes" />

    <script>
      // Applied before first paint so the theme never flashes.
      try {
        const saved = JSON.parse(localStorage.getItem('hartaku.settings') || '{}')
        const theme = saved.theme || 'auto'
        const dark =
          theme === 'dark' ||
          (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      } catch (_) {}
    </script>
  </head>
  <body>
    <!--
      React replaces everything inside #root on mount, so what lands here is only
      ever seen by something that runs no JavaScript - a crawler, or Google's
      OAuth branding review, which reads this page to check the app name and
      purpose.

      The placeholder below is filled at build time from src/lib/landing.js by
      the landingHtmlPlugin in vite.config.js - the same object the React landing
      page renders. Keep it a placeholder: two hand-written copies silently
      disagreeing is what made the review fail in the first place.
    -->
    <div id="root"><!--landing--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
